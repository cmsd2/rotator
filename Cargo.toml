[package]
name = "rotator"
version = "0.1.0"
authors = ["Chris Dawes <cmsd2@cantab.net>"]
edition = "2021"
license = "Apache-2.0 or MIT"

[dependencies]
lambda_runtime = "0.14.4"
serde = { version = "1.0.103", features = ["derive"] }
serde_json = "1.0.42"
env_logger = "0.11"
log = "0.4.8"
lazy_static = "1.4.0"
aws-config = "1.13.0"
aws-sdk-secretsmanager = { version = "1.123.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-iam = { version = "1.131.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
tokio = { version = "1.54.1", features = ["full"] }
aws_lambda_events = { version = "0.17.0", features = ["secretsmanager"] }
thiserror = "2.0.12"
async-trait = "0.1.88"
