[package]
name = "rotator"
version = "0.1.0"
authors = ["Chris Dawes <cmsd2@cantab.net>"]
edition = "2021"
license = "Apache-2.0 or MIT"

[dependencies]
lambda_runtime = "0.14"
serde = { version = "1.0.103", features = ["derive"] }
serde_json = "1.0.42"
env_logger = "0.11"
log = "0.4.8"
lazy_static = "1.4.0"
aws-config = "1.8.4"
aws-sdk-secretsmanager = "1.83.0"
aws-sdk-iam = "1.84.0"
tokio = { version = "1.47.1", features = ["full"] }
aws_lambda_events = { version = "0.17.0", features = ["secretsmanager"] }
thiserror = "2.0.12"
async-trait = "0.1.88"
