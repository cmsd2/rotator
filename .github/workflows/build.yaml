name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the deploy step exchange GitHub's OIDC token for the github-rotator role.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: npm install and test
        run: |
          cd infra
          npm ci
          npm test
        env:
          CI: true
      - name: install rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - name: cache rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install cargo-lambda
        run: pip install cargo-lambda==1.9.2
      - name: test lambdas
        run: cargo test
      - name: package rotator lambda
        run: cargo lambda build --release --x86-64 --output-format zip
      - name: upload lambda zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rotator.zip
          path: target/lambda/rotator/bootstrap.zip
      # Master deploys as github-rotator. Other branches get github-rotator-read,
      # which can only run cdk diff.
      - name: aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::122710858537:role/${{ github.ref == 'refs/heads/master' && 'github-rotator' || 'github-rotator-read' }}
          aws-region: eu-west-1
      - name: diff infra
        if: github.ref != 'refs/heads/master'
        run: |
          cd infra
          npx cdk diff --method=template rotator rotator-test
      # rotator-github-actions is deployed by hand (see infra/README.md), so CI
      # can't change the role it deploys with.
      - name: deploy infra
        if: github.ref == 'refs/heads/master'
        run: |
          cd infra
          npx cdk deploy --require-approval never --ci rotator rotator-test
