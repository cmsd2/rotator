name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: npm install and test
        run: |
          cd infra
          npm ci
          npm test
        env:
          CI: true
      - name: install rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - name: cache rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install cargo-lambda
        run: pip install cargo-lambda==1.9.2
      - name: test lambdas
        run: cargo test
      - name: package rotator lambda
        run: cargo lambda build --release --x86-64 --output-format zip
      - name: upload lambda zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rotator.zip
          path: target/lambda/rotator/bootstrap.zip
      - name: deploy infra
        if: github.ref == 'refs/heads/master'
        run: |
          cd infra
          npx cdk deploy --require-approval never --ci '*'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-1
