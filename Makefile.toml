[tasks.format]
install_crate = "rustfmt"
command = "cargo"
args = ["fmt", "--", "--write-mode=overwrite"]

[tasks.build]
command = "cargo"
args = ["build"]

[tasks.build_release]
command = "cargo"
args = ["build", "--release"]

[tasks.test]
command = "cargo"
args = ["test"]

[tasks.prerelease]
dependencies = [
    "format",
    "build",
    "test"
]

[tasks.ci]
dependencies = [
    "test",
    "lambda_package"
]

[tasks.lambda_package]
command = "cargo"
args = ["lambda", "build", "--release", "--x86-64", "--output-format", "zip"]
